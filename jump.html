<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机端视口优化：禁止用户缩放，防止页面变形 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>即将跳转...</title>
    <style>
        /* 全局重置，让手机和电脑表现一致 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* 适配手机动态工具栏 */
            background-color: #f7f8fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            /* 防止点击时出现灰色半透明闪烁 */
            -webkit-tap-highlight-color: transparent;
        }
        
        .container {
            text-align: center;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
            max-width: 360px;
            width: 100%;
            /* 手机端增加一点弹性 */
            margin: auto;
        }
        
        .icon {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
        }
        
        h2 {
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 600;
            margin: 8px 0 4px 0;
            letter-spacing: 0.5px;
        }
        
        /* 按钮样式 — 手机端加大点击区域 */
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 48px;
            background-color: #07c160;
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            border: none;
            border-radius: 50px; /* 圆角更大，更现代 */
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            max-width: 260px;
            /* 手机点击反馈 */
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        
        .btn:active {
            background-color: #06ad56;
            transform: scale(0.97); /* 按下有轻微缩小效果，模拟物理按键 */
        }
        
        .info {
            color: #888;
            font-size: 15px;
            margin-top: 18px;
            letter-spacing: 0.3px;
        }
        
        /* 深色模式适配 */
        @media (prefers-color-scheme: dark) {
            body { background-color: #18191a; }
            .container { background: #242526; }
            h2 { color: #e4e6eb; }
            .info { color: #b0b3b8; }
            .btn { background-color: #07c160; } /* 保持绿色醒目 */
            .btn:active { background-color: #06ad56; }
        }
        
        /* 小屏手机（宽度 < 380px）进一步调整 */
        @media (max-width: 380px) {
            .container { padding: 30px 20px; }
            .icon { font-size: 44px; }
            h2 { font-size: 19px; }
            .btn { font-size: 16px; padding: 12px 30px; }
            .info { font-size: 13px; }
        }
        
        /* 大屏手机或平板，限制最大宽度避免过于松散 */
        @media (min-width: 600px) {
            .container { max-width: 400px; padding: 50px 40px; }
            .icon { font-size: 64px; }
            h2 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🚀</span>
        <h2>即将前往</h2>
        
        <!-- 目标网址已隐藏，手机端不显示任何链接文字 -->
        
        <button id="goBtn" class="btn">立即前往</button>
        <div class="info" id="countdownInfo">5 秒后自动跳转</div>
    </div>

    <script>
        // *************** 【唯一需要修改的地方】 ***************
        var targetUrl = 'https://qiqibaby3848-gif.github.io/movie-portal/';
        // ****************************************************
        
        // 获取元素
        var btn = document.getElementById('goBtn');
        var countdownInfo = document.getElementById('countdownInfo');
        
        // 倒计时秒数（可按需修改）
        var seconds = 5;
        var timer = null;
        var isRedirecting = false; // 防止多次跳转
        
        // 更新倒计时文字
        function updateCountdown() {
            if (countdownInfo) {
                countdownInfo.textContent = seconds + ' 秒后自动跳转';
            }
        }
        
        // 执行跳转
        function redirectToTarget() {
            if (isRedirecting) return;
            isRedirecting = true;
            
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            // 使用 location.replace 可以避免用户通过“后退”按钮回到这个跳转页
            window.location.replace(targetUrl);
        }
        
        // 按钮点击事件（兼容手机触摸）
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            redirectToTarget();
        });
        
        // 也支持触摸事件，防止移动端延迟
        btn.addEventListener('touchstart', function(e) {
            // 不阻止默认，只做快速响应标记，但click已足够
        }, { passive: true });
        
        // 启动倒计时
        updateCountdown();
        timer = setInterval(function() {
            seconds -= 1;
            if (seconds <= 0) {
                clearInterval(timer);
                timer = null;
                redirectToTarget();
            } else {
                updateCountdown();
            }
        }, 1000);
    </script>
</body>
</html>
