<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>即将进入...</title>
    <style>
        /* ============================================================
           通用重置
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                         "Microsoft YaHei", "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
        }

        /* ============================================================
           第一屏：倒计时
           ============================================================ */
        #screen-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #f7f8fa;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        #screen-loading .container {
            text-align: center;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
            max-width: 360px;
            width: 100%;
            margin: auto;
        }

        #screen-loading .icon {
            font-size: 56px;
            margin-bottom: 12px;
            display: block;
        }

        #screen-loading h2 {
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 600;
            margin: 8px 0 4px 0;
            letter-spacing: 0.5px;
        }

        #screen-loading .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 48px;
            background-color: #07c160;
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            max-width: 260px;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        #screen-loading .btn:active {
            background-color: #06ad56;
            transform: scale(0.97);
        }

        #screen-loading .info {
            color: #888;
            font-size: 15px;
            margin-top: 18px;
            letter-spacing: 0.3px;
        }

        @media (prefers-color-scheme: dark) {
            #screen-loading { background-color: #18191a; }
            #screen-loading .container { background: #242526; }
            #screen-loading h2 { color: #e4e6eb; }
            #screen-loading .info { color: #b0b3b8; }
        }

        @media (max-width: 380px) {
            #screen-loading .container { padding: 30px 20px; }
            #screen-loading .icon { font-size: 44px; }
            #screen-loading h2 { font-size: 19px; }
            #screen-loading .btn { font-size: 16px; padding: 12px 30px; }
            #screen-loading .info { font-size: 13px; }
        }

        @media (min-width: 600px) {
            #screen-loading .container { max-width: 400px; padding: 50px 40px; }
            #screen-loading .icon { font-size: 64px; }
            #screen-loading h2 { font-size: 26px; }
        }

        /* ============================================================
           第二屏：导航页
           ============================================================ */
        #screen-nav {
            display: none;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #fff;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }
        #screen-nav.active {
            display: flex;
            animation: navFadeIn .35s ease;
        }
        @keyframes navFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        #screen-nav .header { text-align: center; margin-bottom: 32px; }
        #screen-nav .header h1 {
            font-size: 30px; font-weight: 700; letter-spacing: 2px;
            margin-bottom: 12px; text-shadow: 0 2px 12px rgba(0,0,0,.4);
        }
        #screen-nav .header .subtitle { font-size: 14px; color: #b8d4dd; line-height: 1.8; }
        #screen-nav .cards {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px; width: 100%; max-width: 620px; margin-top: 8px;
        }
        #screen-nav .card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
            text-decoration: none; color: #fff;
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
            backdrop-filter: blur(8px);
        }
        #screen-nav .card:hover {
            transform: translateY(-3px); background: rgba(255,255,255,.16);
            box-shadow: 0 8px 22px rgba(0,0,0,.35);
        }
        #screen-nav .card .left { display: flex; align-items: center; gap: 10px; }
        #screen-nav .card .icon {
            width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px;
            background: linear-gradient(135deg, #ff6a88, #ff99ac);
            display: flex; align-items: center; justify-content: center; font-size: 17px;
        }
        #screen-nav .card:nth-child(2) .icon { background: linear-gradient(135deg,#4facfe,#00f2fe); }
        #screen-nav .card:nth-child(3) .icon { background: linear-gradient(135deg,#43e97b,#38f9d7); }
        #screen-nav .card:nth-child(4) .icon { background: linear-gradient(135deg,#fa709a,#fee140); }
        #screen-nav .card:nth-child(5) .icon { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }
        #screen-nav .card .title { font-size: 14px; font-weight: 600; }
        #screen-nav .card .tag { font-size: 11px; color: #cfe6ee; margin-top: 2px; }
        #screen-nav .card .arrow { font-size: 17px; color: #ffd76e; }
        #screen-nav .footer { margin-top: 40px; font-size: 12px; color: #8fb0ba; text-align: center; line-height: 1.8; }

        /* ============================================================
           引导遮罩层
           ============================================================ */
        #guide-mask {
            display: none;
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(8, 12, 20, .92);
            backdrop-filter: blur(4px);
            color: #fff;
        }
        #guide-mask.show { display: block; }
        .guide-arrow {
            position: fixed; top: 12px; right: 16px;
            display: flex; flex-direction: column; align-items: center;
            color: #ffd76e;
            animation: bounce 1.1s ease-in-out infinite;
        }
        .guide-arrow .ico { font-size: 42px; line-height: 1; }
        .guide-arrow .dots { font-size: 26px; font-weight: 700; letter-spacing: 3px; margin-top: -4px; }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .guide-card {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% - 48px); max-width: 340px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 20px;
            padding: 32px 26px;
            text-align: center;
        }
        .guide-card .g-emoji { font-size: 40px; margin-bottom: 14px; }
        .guide-card .g-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
        .guide-card .g-sub { font-size: 13px; color: #9fb4c4; margin-bottom: 26px; }
        .guide-steps { text-align: left; }
        .guide-steps .step {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 0;
            font-size: 15px; line-height: 1.5;
        }
        .guide-steps .step + .step { border-top: 1px solid rgba(255,255,255,.08); }
        .guide-steps .num {
            flex-shrink: 0;
            width: 26px; height: 26px; border-radius: 50%;
            background: linear-gradient(135deg,#ffd76e,#ffb84d); color: #1a1a1a;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
        }
        .guide-steps .dots { color: #ffd76e; font-weight: 700; letter-spacing: 2px; }
        .guide-card .g-tip {
            margin-top: 22px; font-size: 12px; color: #7f93a3; line-height: 1.6;
        }
        .guide-close-btn {
            margin-top: 24px;
            width: 100%;
            padding: 13px 0;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg,#ffd76e,#ffb84d);
            color: #1a1a1a;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: opacity .15s ease;
        }
        .guide-close-btn:active { opacity: .8; }
    </style>
</head>
<body>

    <!-- ============================================================
         第一屏：倒计时
         ============================================================ -->
    <div id="screen-loading">
        <div class="container">
            <span class="icon">🚀</span>
            <h2>即将前往</h2>
            <button id="goBtn" class="btn">立即前往</button>
            <div class="info" id="countdownInfo">5 秒后自动进入</div>
        </div>
    </div>

    <!-- ============================================================
         第二屏：导航页
         ============================================================ -->
    <div id="screen-nav">
        <!-- 引导遮罩 -->
        <div id="guide-mask">
            <div class="guide-arrow">
                <span class="ico">☝</span>
                <span class="dots">···</span>
            </div>
            <div class="guide-card">
                <div class="g-emoji">🌐</div>
                <div class="g-title">请用浏览器打开</div>
                <div class="g-sub">当前环境无法正常观影，仅需两步</div>
                <div class="guide-steps">
                    <div class="step"><span class="num">1</span><span>点击右上角 <span class="dots">···</span></span></div>
                    <div class="step"><span class="num">2</span><span>选择「在浏览器打开」</span></div>
                </div>
                <div class="g-tip">若无该选项，请选「在默认浏览器中打开」</div>
                <button type="button" class="guide-close-btn" id="guide-close">我知道了</button>
            </div>
        </div>

        <div class="header">
            <h1>✦ 开心快乐每一天 ✦</h1>
            <div class="subtitle">点击下方卡片即可查看</div>
        </div>

        <div class="cards">
            <a class="card" href="http://sdymkeji.com/?806985,3326,0G2" target="_blank" rel="noopener">
                <div class="left"><div class="icon">🎬</div>
                    <div><div class="title">观影入口通道一</div><div class="tag">点播 · 线路1</div></div></div>
                <span class="arrow">›</span>
            </a>
            <a class="card" href="http://tianhao.erobbing.com/?3191060,4294,aht" target="_blank" rel="noopener">
                <div class="left"><div class="icon">🎥</div>
                    <div><div class="title">观影入口通道二</div><div class="tag">点播 · 线路2</div></div></div>
                <span class="arrow">›</span>
            </a>
            <a class="card" href="http://ZOWD327706864.operi.8866.org/qaAyCj0G/6w0vIlHz?423356%2C93791%2C56nFL&y=55" target="_blank" rel="noopener">
                <div class="left"><div class="icon">🍿</div>
                    <div><div class="title">观影入口通道三</div><div class="tag">点播 · 线路3</div></div></div>
                <span class="arrow">›</span>
            </a>
            <a class="card" href="http://sdymkeji.com/?808873,2896,2" target="_blank" rel="noopener">
                <div class="left"><div class="icon">📡</div>
                    <div><div class="title">观影入口通道四</div><div class="tag">直播 · 线路4</div></div></div>
                <span class="arrow">›</span>
            </a>
            <a class="card" href="http://tianhao.erobbing.com/?3193399,7149,aY" target="_blank" rel="noopener">
                <div class="left"><div class="icon">📺</div>
                    <div><div class="title">观影入口通道五</div><div class="tag">直播 · 线路5</div></div></div>
                <span class="arrow">›</span>
            </a>
        </div>

        <div class="footer">
            如某个入口打不开，请尝试其他通道
        </div>
    </div>

    <script>
        (function () {
            // ============================================================
            // 第一部分：倒计时逻辑
            // ============================================================
            var btn = document.getElementById('goBtn');
            var countdownInfo = document.getElementById('countdownInfo');
            var loadingScreen = document.getElementById('screen-loading');
            var navScreen = document.getElementById('screen-nav');

            var seconds = 5;          // 倒计时秒数，可自行修改
            var timer = null;
            var hasEntered = false;   // 防止重复进入

            function updateCountdown() {
                if (countdownInfo) {
                    countdownInfo.textContent = seconds + ' 秒后自动进入';
                }
            }

            // 切换到导航页
            function enterNav() {
                if (hasEntered) return;
                hasEntered = true;

                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }

                // 切换屏幕
                loadingScreen.style.display = 'none';
                navScreen.classList.add('active');

                // 同步更新浏览器标签标题
                document.title = '· 开心快乐每一天 ·';

                // 进入导航页后检测微信/QQ 内置浏览器
                initGuideMask();
            }

            // 按钮点击
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                enterNav();
            });

            // 启动倒计时
            updateCountdown();
            timer = setInterval(function () {
                seconds -= 1;
                if (seconds <= 0) {
                    enterNav();
                } else {
                    updateCountdown();
                }
            }, 1000);

            // ============================================================
            // 第二部分：导航页逻辑
            // ============================================================
            function initGuideMask() {
                var ua = navigator.userAgent.toLowerCase();
                var isInApp = /micromessenger|qq\/|qzone|weibo|wechat/.test(ua);
                if (isInApp) {
                    document.getElementById('guide-mask').classList.add('show');
                }
                var closeBtn = document.getElementById('guide-close');
                if (closeBtn && !closeBtn.dataset.bound) {
                    closeBtn.dataset.bound = '1';
                    closeBtn.addEventListener('click', function () {
                        document.getElementById('guide-mask').classList.remove('show');
                    });
                }
            }
        })();
    </script>
</body>
</html>
